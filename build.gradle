plugins {
    id 'fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mod Menu (optional, nur compileOnly)
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu ist optional: nur zum Kompilieren.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Zum Testen mit einer weiteren Mod-Jar: gradlew runClientGameTest -PextraMod=pfad/zur.jar
    if (project.hasProperty("extraMod")) modLocalRuntime files(project.property("extraMod"))
}

processResources {
    // README liegt direkt in der Mod-Jar
    from(projectDir) {
        include 'README.md', 'README.de.md'
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // Cosmetics: Blockbench legt eine Kopie der Textur als Base64 in jedes Modell – der Client nimmt die PNG daneben.
    // In der Jar weglassen (kleiner, und Scanner melden keine „Base64-Blobs“ mehr); die Quelldateien bleiben unverändert.
    filesMatching('**/*.bbmodel') {
        filter { String line -> line.replaceAll('"source":"data:image/[^"]*"', '"source":""') }
        // Sicherheit: Speicherpfade (enthalten den Windows-Benutzernamen) nie mit in die Jar
        filter { String line -> line.replaceAll('"(path|relative_path|export_path|save_path|folder)":"[^"]*"', '"$1":""') }
        // Blockbench-Notiz „gespeichert“ – Metadaten, braucht der Client nicht
        filter { String line -> line.replaceAll(',"saved":(true|false)', '').replaceAll('"saved":(true|false),', '') }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:deprecation'
    // ohne Variablen-Namen in den Klassen: Jar kleiner, Zeilennummern für Fehlerberichte bleiben
    if (it.name == 'compileJava') it.options.compilerArgs << '-g:source,lines'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    // Download-Code der privaten Packs kommt nur in die private Jar
    if (!project.hasProperty('privatePacks')) exclude 'com/nuggetclient/style/PrivateDownload*'
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Native DLL (native/, CMake): gradlew buildNative baut native/build/out/nugget_native.dll.
// Sie wird in die Jar gepackt (natives/windows-x64/). Ohne CMake oder mit -PnoNative wird sie
// übersprungen, dann läuft der Client wie bisher nur mit Java.
def findCmake = {
    def names = System.getProperty('os.name').toLowerCase().contains('win') ? ['cmake.exe'] : ['cmake']
    def dirs = [file('native/toolchain/cmake/bin').path] + (System.getenv('PATH') ?: '').split(File.pathSeparator).toList() + ['C:/Program Files/CMake/bin']
    dirs.collectMany { d -> names.collect { new File(d, it) } }.find { it.isFile() }
}
def nativeOut = file('native/build/out')
def buildNative = tasks.register('buildNative') {
    inputs.dir('native/src')
    inputs.file('native/CMakeLists.txt')
    outputs.dir(nativeOut)
    // Standard: ohne DLL (Virenscanner können Maschinen-Code nicht prüfen). Mit -PwithNative wird sie gebaut und eingepackt.
    onlyIf { project.hasProperty('withNative') && System.getProperty('os.name').toLowerCase().contains('win') }
    doLast {
        def cmake = findCmake()
        if (cmake == null) {
            logger.warn('CMake nicht gefunden: nugget_native.dll wird nicht gebaut, Jar nutzt nur Java')
            return
        }
        def bdir = file('native/build/cmake')
        // Eigene Toolchain in native/toolchain (isoliert, nicht systemweit installiert)
        def tc = file('native/toolchain')
        def tcArgs = file("$tc/llvm-mingw/bin/clang++.exe").isFile() ? ['-G', 'Ninja',
                "-DCMAKE_MAKE_PROGRAM=${file("$tc/ninja/ninja.exe").path}",
                "-DCMAKE_CXX_COMPILER=${file("$tc/llvm-mingw/bin/clang++.exe").path}"] : []
        providers.exec { commandLine([cmake.path, '-S', file('native').path, '-B', bdir.path] + tcArgs + ['-DCMAKE_BUILD_TYPE=Release',
                "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${nativeOut.path}", "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=${nativeOut.path}",
                "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${nativeOut.path}"]) }.result.get().assertNormalExitValue()
        providers.exec { commandLine cmake.path, '--build', bdir.path, '--config', 'Release' }.result.get().assertNormalExitValue()
    }
}
processResources {
    dependsOn buildNative
    if (project.hasProperty('withNative')) {
        from(nativeOut) {
            include 'nugget_native.dll'
            into 'natives/windows-x64'
        }
    }
}

// Metadaten komplett entfernen: feste Zeitstempel, feste Reihenfolge und kein Manifest mit Build-Infos
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

remapJar {
    doLast {
        def jarFile = archiveFile.get().asFile
        def tmp = new File(jarFile.path + '.tmp')
        def skip = ['META-INF/MANIFEST.MF', 'META-INF/']
        new java.util.zip.ZipFile(jarFile).withCloseable { zin ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(tmp)).withCloseable { zout ->
                zin.entries().toList().findAll { !(it.name in skip) }.sort { it.name }.each { e ->
                    def out = new java.util.zip.ZipEntry(e.name)
                    out.timeLocal = java.time.LocalDateTime.of(1980, 2, 1, 0, 0) // keine echte Bauzeit, ohne Zeitzonen-Feld
                    zout.putNextEntry(out)
                    if (!e.directory) zin.getInputStream(e).withCloseable { zout << it }
                    zout.closeEntry()
                }
            }
        }
        jarFile.delete()
        tmp.renameTo(jarFile)
    }
}

// Test mit der fertigen Jar wie im echten Spiel: gradlew prodClient
tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(remapJar.archiveFile)
    def fabricApiJar = configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"))
    fabricApiJar.transitive = false
    mods.from(fabricApiJar)
    runDir = file("build/run/prod")
}

// Automatischer In-Game-Test (startet den echten Client): gradlew runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'nugget_client-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Testclient immer stumm starten (Master-Lautstärke 0)
tasks.matching { it.name in ["runClientGameTest", "runClient", "prodClient"] }.configureEach {
    doFirst {
        def runDir = file([runClientGameTest: "build/run/clientGameTest", prodClient: "build/run/prod"][it.name] ?: "run")
        runDir.mkdirs()
        def opts = new File(runDir, 'options.txt')
        def lines = opts.exists() ? opts.readLines('UTF-8').findAll { !it.startsWith('soundCategory_master:') && !it.startsWith('onboardAccessibility:') } : []
        lines << 'soundCategory_master:0.0' << 'onboardAccessibility:false'
        opts.write(lines.join('\n') + '\n', 'UTF-8')
    }
}

