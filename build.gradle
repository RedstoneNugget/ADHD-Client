// Quellcode als ZIP (Open Source, ohne Build-Ordner und Testwelten, feste Zeitstempel): gradlew sourceZip
tasks.register('sourceZip', Zip) {
    archiveFileName = "nugget-client-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    into("nugget-client-${project.version}") {
        from(projectDir) {
            include 'src/**', 'gradle/**', 'docs/**', '.github/**'
            include 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat'
            include 'LICENSE', 'README.md', 'README.de.md', '.gitignore', '.gitattributes'
            exclude '**/.DS_Store', 'docs/mockup*', '**/nugget_private.txt'
            // gradlew muss unter Linux/macOS ausführbar sein
            filesMatching('gradlew') { permissions { unix('rwxr-xr-x') } }
        }
    }
}

// Private Version mit Pack-Liste: gradlew build -x test -PprivatePacks  (die Liste kommt sonst nie ins Jar)
processResources {
    if (!project.hasProperty('privatePacks')) exclude 'assets/nugget_client/nugget_private.txt'
}
if (project.hasProperty('privatePacks')) {
    tasks.named('jar') { archiveClassifier = 'private-dev' }
    tasks.named('remapJar') { archiveClassifier = 'private' }
}

