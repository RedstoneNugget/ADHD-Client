plugins {
    id 'fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mod Menu (optional, nur compileOnly)
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu ist optional: nur zum Kompilieren.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Metadaten komplett entfernen: feste Zeitstempel, feste Reihenfolge und kein Manifest mit Build-Infos
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

remapJar {
    doLast {
        def jarFile = archiveFile.get().asFile
        def tmp = new File(jarFile.path + '.tmp')
        def skip = ['META-INF/MANIFEST.MF', 'META-INF/']
        new java.util.zip.ZipFile(jarFile).withCloseable { zin ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(tmp)).withCloseable { zout ->
                zin.entries().toList().findAll { !(it.name in skip) }.sort { it.name }.each { e ->
                    def out = new java.util.zip.ZipEntry(e.name)
                    out.timeLocal = java.time.LocalDateTime.of(1980, 1, 1, 0, 0) // keine echte Bauzeit
                    zout.putNextEntry(out)
                    if (!e.directory) zin.getInputStream(e).withCloseable { zout << it }
                    zout.closeEntry()
                }
            }
        }
        jarFile.delete()
        tmp.renameTo(jarFile)
    }
}

// Test mit der fertigen Jar wie im echten Spiel: gradlew prodClient
tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(remapJar.archiveFile)
    def fabricApiJar = configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"))
    fabricApiJar.transitive = false
    mods.from(fabricApiJar)
    runDir = file("build/run/prod")
}

// Automatischer In-Game-Test (startet den echten Client): gradlew runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'adhd_client-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Testclient immer stumm starten (Master-Lautstärke 0)
tasks.matching { it.name in ["runClientGameTest", "runClient", "prodClient"] }.configureEach {
    doFirst {
        def runDir = file([runClientGameTest: "build/run/clientGameTest", prodClient: "build/run/prod"][it.name] ?: "run")
        runDir.mkdirs()
        def opts = new File(runDir, 'options.txt')
        def lines = opts.exists() ? opts.readLines('UTF-8').findAll { !it.startsWith('soundCategory_master:') && !it.startsWith('onboardAccessibility:') } : []
        lines << 'soundCategory_master:0.0' << 'onboardAccessibility:false'
        opts.write(lines.join('\n') + '\n', 'UTF-8')
    }
}
