name: Release

# Wird eine Versionsnummer wie v1.0.0 hochgeladen, baut GitHub die Mod und
# veröffentlicht ein GitHub-Release mit der .jar. Text: .github/release-notes.md
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen
        run: ./gradlew build
      - name: GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: ADHD Client ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: build/libs/adhd-client-*.jar
